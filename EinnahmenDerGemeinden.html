<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Kommunale Finanzen</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --accent-color: #ffc107;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header & Progress */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-text {
            text-align: left;
        }

        h1 { margin: 0; font-size: 1.5rem; }
        .subtitle { font-size: 0.9rem; opacity: 0.8; margin-top: 5px; }

        .score-board {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            min-width: 100px;
            text-align: center;
        }

        .progress-container {
            background-color: #e9ecef;
            height: 8px;
            width: 100%;
        }
        .progress-bar {
            background-color: var(--accent-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Content Area */
        .content {
            padding: 30px;
            flex-grow: 1;
        }

        .question-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Buttons & Interactions */
        .btn-option {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 12px;
            background-color: white;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-color);
        }

        .btn-option:hover:not([disabled]) {
            background-color: #f8f9fa;
            border-color: var(--primary-color);
        }

        .btn-option.correct {
            background-color: #d4edda;
            border-color: var(--success-color);
            color: #155724;
        }

        .btn-option.wrong {
            background-color: #f8d7da;
            border-color: var(--error-color);
            color: #721c24;
        }

        /* Matching Styles */
        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }
        
        .match-row label { flex: 1; margin-right: 10px; font-weight: 500; }
        .match-row select { 
            flex: 1; 
            padding: 8px; 
            border-radius: 4px; 
            border: 1px solid #ced4da;
            max-width: 50%;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
        }

        /* Feedback Section */
        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .feedback-box.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .feedback-box.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .feedback-box.info { background-color: #cce5ff; color: #004085; border: 1px solid #b8daff; }

        /* Navigation Buttons */
        .nav-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            float: right;
            display: none;
        }
        .nav-btn:hover { background-color: #004494; }

        .check-btn {
            background-color: var(--text-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            display: inline-block;
        }

        /* Result Screen */
        .result-container {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }
        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }

        .review-container {
            text-align: left;
            margin-top: 30px;
            display: none;
            border-top: 2px solid #e9ecef;
            padding-top: 20px;
        }
        .review-item {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .review-question { font-weight: bold; margin-bottom: 10px; color: var(--primary-color); }
        .review-answer { color: #28a745; font-weight: 500; }
        .review-info { font-style: italic; color: #666; margin-top: 5px; font-size: 0.9rem; border-left: 3px solid #17a2b8; padding-left: 10px; }

        @media (max-width: 600px) {
            header { flex-direction: column; align-items: flex-start; }
            .score-board { margin-top: 10px; align-self: flex-end; }
            .match-row { flex-direction: column; align-items: flex-start; }
            .match-row select { max-width: 100%; width: 100%; margin-top: 5px; }
            .content { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-text">
            <h1>Kommunale Finanzen</h1>
            <div class="subtitle">Übungsaufgaben für Verwaltungsfachangestellte</div>
        </div>
        <div class="score-board">
            Punkte: <span id="scoreValue">0</span>
        </div>
    </header>
    
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="content" id="quizArea">
        <!-- Questions render here -->
    </div>

    <div class="result-container" id="resultArea">
        <h2>Auswertung</h2>
        <div class="score-display" id="finalScoreDisplay">0</div>
        <p id="finalMessage">Ladet...</p>
        
        <div style="margin-top: 20px;">
            <button class="nav-btn" style="display:inline-block; float:none; margin-right: 10px; background-color: #6c757d;" onclick="showReview()">Lösungen ansehen</button>
            <button class="nav-btn" style="display:inline-block; float:none;" onclick="location.reload()">Quiz wiederholen</button>
        </div>

        <div id="reviewArea" class="review-container"></div>
    </div>
</div>

<script>
    // --- DATEN ---
    const quizData = [
        {
            type: 'mc',
            question: "1. Welche der folgenden Einnahmequellen gehört NICHT zu den „vier Säulen“ der gemeindlichen Finanzierung gemäß Art. 106 GG?",
            answers: [
                "Beteiligung an der Einkommen- und Umsatzsteuer",
                "Realsteuergarantie",
                "Zuweisungen aus dem Europäischer Sozialfonds",
                "Finanzausgleich (Zuweisungen des Landes)"
            ],
            correct: 2, 
            info: "Der Europäische Sozialfonds ist ein EU-Instrument und keine der 4 verfassungsrechtlichen Säulen der deutschen Gemeindefinanzierung."
        },
        {
            type: 'mc',
            question: "2. Was ist das wesentliche Unterscheidungsmerkmal von Steuern gegenüber Gebühren und Beiträgen?",
            answers: [
                "Steuern werden nur von Unternehmen gezahlt.",
                "Steuern sind Geldleistungen ohne Anspruch auf eine konkrete Gegenleistung.",
                "Steuern sind immer zweckgebunden für Investitionen.",
                "Steuern werden auf freiwilliger Basis entrichtet."
            ],
            correct: 1,
            info: "Das Non-Affektationsprinzip besagt: Steuern fließen in den allgemeinen Haushalt ohne direkte Gegenleistung."
        },
        {
            type: 'mc',
            question: "3. Welche Aussage zur Kreditaufnahme durch Gemeinden ist gemäß der Rangfolge der Einnahmen (Art. 62 GO) korrekt?",
            answers: [
                "Kredite sind die primäre Einnahmequelle.",
                "Kredite dürfen zur Deckung aller laufenden Ausgaben (z. B. Gehälter) aufgenommen werden.",
                "Kredite stehen an letzter Stelle und dürfen nur für Investitionen aufgenommen werden.",
                "Kredite sind den Steuern rechtlich gleichgestellt."
            ],
            correct: 2,
            info: "Kredite sind subsidiär (nachrangig) und zweckgebunden für Investitionen."
        },
        {
            type: 'mc',
            question: "4. Worauf wird die Grundsteuer erhoben?",
            answers: [
                "Auf das Einkommen des Eigentümers.",
                "Auf den Gewinn von Gewerbebetrieben.",
                "Auf den Wert des Grundbesitzes (unabhängig von Leistungsfähigkeit).",
                "Auf die Anzahl der Personen im Haushalt."
            ],
            correct: 2,
            info: "Die Grundsteuer ist eine Objektsteuer, die sich am Wert des Grundstücks orientiert."
        },
        {
            type: 'bool',
            question: "5. Beiträge werden erhoben, wenn jemand eine öffentliche Einrichtung tatsächlich benutzt (z. B. Müllabfuhr).",
            correct: false, 
            info: "Die tatsächliche Nutzung beschreibt Gebühren. Beiträge zahlt man für die bloße MÖGLICHKEIT der Nutzung (z. B. Erschließung)."
        },
        {
            type: 'bool',
            question: "6. Die Hundesteuer zählt zu den örtlichen Aufwandsteuern und darf nur mit Satzung erhoben werden.",
            correct: true, 
            info: "Die Hundesteuer ist eine klassische Aufwandsteuer."
        },
        {
            type: 'match',
            question: "7. Ordnen Sie die Einnahmearten korrekt zu:",
            pairs: [
                { term: "Gewerbesteuer", match: "Realsteuer" },
                { term: "Eintrittsgeld Schwimmbad", match: "Gebühr" },
                { term: "Straßenerschließung", match: "Beitrag" },
                { term: "Zweitwohnungssteuer", match: "Örtliche Aufwandsteuer" }
            ],
            options: ["Realsteuer", "Gebühr", "Beitrag", "Örtliche Aufwandsteuer"],
            info: "Diese Unterscheidung ist essenziell für die kommunale Finanzwirtschaft."
        },
        {
            type: 'match',
            question: "8. Ordnen Sie die Definitionen den Fachbegriffen zu:",
            pairs: [
                { term: "Zahlung für MÖGLICHKEIT der Nutzung", match: "Beitrag" },
                { term: "Zahlung für TATSÄCHLICHE Nutzung", match: "Gebühr" },
                { term: "Zahlung OHNE Gegenleistung", match: "Steuer" }
            ],
            options: ["Steuer", "Beitrag", "Gebühr"],
            info: "Dies sind die grundlegenden Definitionen im Abgabenrecht."
        },
        {
            type: 'open',
            question: "9. Erläutern Sie den Unterschied zwischen „Erschließungsbeitrag“ und „Herstellungsbeitrag“.",
            solution: "Erschließungsbeitrag = Erstmalige Herstellung von Straßen/Wegen (Verkehrsanbindung).\nHerstellungsbeitrag = Leitungsgebundene Anlagen (z.B. Wasser/Abwasser).",
            info: "Vergleichen Sie Ihre Antwort mit der Lösung."
        }
    ];

    // --- LOGIK ---
    let currentStep = 0;
    let currentScore = 0;
    let attemptsMatch = 0; // Zähler für Versuche bei Matching
    
    // Konstanten für Punkte
    const POINTS_CORRECT_INSTANT = 100;
    const POINTS_MATCH_START = 100;
    const POINTS_MATCH_PENALTY = 20; // Abzug pro Fehlversuch
    const POINTS_MATCH_MIN = 10;     // Mindestpunkte wenn gelöst

    const quizArea = document.getElementById('quizArea');
    const resultArea = document.getElementById('resultArea');
    const progressBar = document.getElementById('progressBar');
    const scoreValueEl = document.getElementById('scoreValue');

    function initQuiz() {
        updateScoreUI();
        renderQuestion();
    }

    function updateScoreUI() {
        scoreValueEl.innerText = currentScore;
    }

    function addPoints(pts) {
        currentScore += pts;
        updateScoreUI();
    }

    function renderQuestion() {
        attemptsMatch = 0; // Reset Versuche für neue Frage

        // Update Progress
        const percent = (currentStep / quizData.length) * 100;
        progressBar.style.width = percent + "%";

        const q = quizData[currentStep];
        quizArea.innerHTML = ''; 

        // Title
        const title = document.createElement('div');
        title.className = 'question-title';
        title.innerText = q.question;
        quizArea.appendChild(title);

        // Render Answer Area
        if (q.type === 'mc') renderMC(q);
        else if (q.type === 'bool') renderBool(q);
        else if (q.type === 'match') renderMatch(q);
        else if (q.type === 'open') renderOpen(q);
    }

    // --- RENDER FUNKTIONEN ---

    function renderMC(q) {
        q.answers.forEach((ans, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = ans;
            btn.onclick = () => solveMC(btn, idx, q);
            quizArea.appendChild(btn);
        });
        createFeedbackBox();
        createNextBtn();
    }

    function renderBool(q) {
        const btnTrue = document.createElement('button');
        btnTrue.className = 'btn-option';
        btnTrue.innerText = "Wahr / Richtig";
        btnTrue.onclick = () => solveBool(btnTrue, true, q);
        
        const btnFalse = document.createElement('button');
        btnFalse.className = 'btn-option';
        btnFalse.innerText = "Falsch";
        btnFalse.onclick = () => solveBool(btnFalse, false, q);

        quizArea.appendChild(btnTrue);
        quizArea.appendChild(btnFalse);
        createFeedbackBox();
        createNextBtn();
    }

    function renderMatch(q) {
        q.pairs.forEach((pair, idx) => {
            const row = document.createElement('div');
            row.className = 'match-row';
            
            let optionsHtml = '<option value="" selected disabled>Bitte wählen...</option>';
            q.options.forEach(opt => {
                optionsHtml += `<option value="${opt}">${opt}</option>`;
            });

            row.innerHTML = `
                <label>${pair.term}</label>
                <select id="match_select_${idx}">${optionsHtml}</select>
            `;
            quizArea.appendChild(row);
        });

        const checkBtn = document.createElement('button');
        checkBtn.className = 'check-btn';
        checkBtn.innerText = "Überprüfen";
        checkBtn.onclick = () => solveMatch(q, checkBtn);
        quizArea.appendChild(checkBtn);

        createFeedbackBox();
        createNextBtn();
    }

    function renderOpen(q) {
        const textarea = document.createElement('textarea');
        textarea.placeholder = "Geben Sie hier Ihre Antwort ein...";
        quizArea.appendChild(textarea);

        const checkBtn = document.createElement('button');
        checkBtn.className = 'check-btn';
        checkBtn.innerText = "Lösung anzeigen";
        checkBtn.onclick = () => solveOpen(q, textarea.value, checkBtn);
        quizArea.appendChild(checkBtn);

        createFeedbackBox();
        createNextBtn();
    }

    // --- LOGIK & PUNKTE ---

    function createFeedbackBox() {
        const box = document.createElement('div');
        box.id = 'feedbackBox';
        box.className = 'feedback-box';
        quizArea.appendChild(box);
    }

    function createNextBtn() {
        const btn = document.createElement('button');
        btn.id = 'nextBtn';
        btn.className = 'nav-btn';
        btn.innerText = "Nächste Frage";
        btn.onclick = nextStep;
        quizArea.appendChild(btn);
    }

    function disableAllButtons() {
        const btns = document.querySelectorAll('.btn-option');
        btns.forEach(b => b.disabled = true);
    }

    function showFeedback(isCorrect, text, showNext = true) {
        const box = document.getElementById('feedbackBox');
        const nextBtn = document.getElementById('nextBtn');
        
        box.style.display = 'block';
        box.className = isCorrect ? 'feedback-box success' : 'feedback-box error';
        box.innerHTML = (isCorrect ? '<strong>Richtig!</strong> ' : '<strong>Falsch.</strong> ') + text;
        
        if (showNext) {
            nextBtn.style.display = 'inline-block';
        } else {
            nextBtn.style.display = 'none';
        }
    }

    function solveMC(btn, idx, q) {
        disableAllButtons();
        const isCorrect = (idx === q.correct);
        if (isCorrect) {
            btn.classList.add('correct');
            addPoints(POINTS_CORRECT_INSTANT);
            showFeedback(true, q.info + " (+100 Pkt)");
        } else {
            btn.classList.add('wrong');
            showFeedback(false, q.info + " (0 Pkt)");
        }
    }

    function solveBool(btn, val, q) {
        disableAllButtons();
        const isCorrect = (val === q.correct);
        if(isCorrect) {
            btn.classList.add('correct');
            addPoints(POINTS_CORRECT_INSTANT);
            showFeedback(true, q.info + " (+100 Pkt)");
        } else {
            btn.classList.add('wrong');
            showFeedback(false, q.info + " (0 Pkt)");
        }
    }

    function solveMatch(q, btn) {
        attemptsMatch++;
        let allCorrect = true;
        
        q.pairs.forEach((pair, idx) => {
            const select = document.getElementById(`match_select_${idx}`);
            const userVal = select.value;
            
            if (userVal === pair.match) {
                select.style.borderColor = 'green';
                select.style.backgroundColor = '#d4edda';
            } else {
                select.style.borderColor = 'red';
                select.style.backgroundColor = '#f8d7da';
                allCorrect = false;
            }
        });

        const box = document.getElementById('feedbackBox');
        
        if (allCorrect) {
            // Berechnung der Punkte basierend auf Versuchen
            // 1. Versuch: 100, 2. Versuch: 80, 3. Versuch: 60 ... Min 10
            let earnedPoints = Math.max(POINTS_MATCH_MIN, POINTS_MATCH_START - ((attemptsMatch - 1) * POINTS_MATCH_PENALTY));
            addPoints(earnedPoints);

            btn.style.display = 'none'; // Check Button weg
            
            // Alles disablen
            q.pairs.forEach((_, idx) => document.getElementById(`match_select_${idx}`).disabled = true);

            box.style.display = 'block';
            box.className = 'feedback-box success';
            box.innerHTML = `<strong>Perfekt!</strong> Alle Zuordnungen stimmen. (+${earnedPoints} Pkt)`;
            document.getElementById('nextBtn').style.display = 'inline-block';

        } else {
            // Falsch -> Nochmal versuchen
            box.style.display = 'block';
            box.className = 'feedback-box error';
            box.innerHTML = `<strong>Nicht ganz.</strong> Überprüfen Sie die rot markierten Felder.<br>Versuch Nr. ${attemptsMatch}.`;
            // Weiter-Button bleibt versteckt
            document.getElementById('nextBtn').style.display = 'none';
        }
    }

    function solveOpen(q, userText, btn) {
        btn.style.display = 'none';
        
        const box = document.getElementById('feedbackBox');
        box.style.display = 'block';
        box.className = 'feedback-box info';
        
        box.innerHTML = `
            <div><strong>Ihre Antwort:</strong><br><em>${userText || "Keine Eingabe"}</em></div>
            <hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">
            <div><strong>Musterlösung:</strong><br>${q.solution.replace(/\n/g, '<br>')}</div>
            <div style="margin-top:15px;">
                <strong>Bewerten Sie sich selbst:</strong><br>
                <button class="check-btn" style="background-color:#28a745; margin-right:5px;" onclick="rateOpen(100)">Korrekt / Sinngemäß (+100 Pkt)</button>
                <button class="check-btn" style="background-color:#dc3545;" onclick="rateOpen(0)">Falsch (0 Pkt)</button>
            </div>
        `;
    }

    function rateOpen(points) {
        addPoints(points);
        document.getElementById('nextBtn').style.display = 'inline-block';
        const btns = document.querySelectorAll('.feedback-box button');
        btns.forEach(b => b.disabled = true);
    }

    function nextStep() {
        currentStep++;
        if (currentStep < quizData.length) {
            renderQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizArea.style.display = 'none';
        progressBar.parentElement.style.display = 'none';
        resultArea.style.display = 'block';

        const finalScoreEl = document.getElementById('finalScoreDisplay');
        const finalMsg = document.getElementById('finalMessage');

        // Maximal mögliche Punkte berechnen (einfachheitshalber 100 pro Frage)
        const maxScore = quizData.length * 100;
        finalScoreEl.innerText = `${currentScore} / ${maxScore} Punkte`;
        
        const percentage = (currentScore / maxScore) * 100;
        
        if (percentage >= 90) {
            finalMsg.innerText = "Hervorragend! Sie sind ein Finanz-Experte.";
        } else if (percentage >= 75) {
            finalMsg.innerText = "Sehr gut! Sie haben das Thema verstanden.";
        } else if (percentage >= 50) {
            finalMsg.innerText = "Gut gemacht. Ein paar Details fehlen noch.";
        } else {
            finalMsg.innerText = "Üben Sie das Kapitel Einnahmequellen am besten noch einmal.";
        }
    }

    function showReview() {
        const reviewArea = document.getElementById('reviewArea');
        if (reviewArea.style.display === 'block') return; 
        
        reviewArea.style.display = 'block';
        reviewArea.innerHTML = '<h3>Lösungsübersicht</h3>';

        quizData.forEach((q, idx) => {
            const item = document.createElement('div');
            item.className = 'review-item';
            
            let answerText = "";
            if (q.type === 'mc') answerText = q.answers[q.correct];
            else if (q.type === 'bool') answerText = q.correct ? "Wahr / Richtig" : "Falsch";
            else if (q.type === 'match') answerText = q.pairs.map(p => `<b>${p.term}</b> &rarr; ${p.match}`).join('<br>');
            else if (q.type === 'open') answerText = q.solution.replace(/\n/g, '<br>');

            item.innerHTML = `
                <div class="review-question">${idx + 1}. ${q.question}</div>
                <div class="review-answer">Richtige Lösung: <br>${answerText}</div>
                <div class="review-info">ℹ️ ${q.info}</div>
            `;
            reviewArea.appendChild(item);
        });
        reviewArea.scrollIntoView({ behavior: 'smooth' });
    }

    initQuiz();

</script>
</body>
</html>
